name: Price Refresh

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      max_steps:
        description: "Maximum lazy-load steps per verified partition"
        required: true
        default: "300"
        type: string
      scroll_delay_ms:
        description: "Delay between lazy-load steps (ms)"
        required: true
        default: "400"
        type: string
      minimum_partition_coverage:
        description: "Target coverage for each price partition"
        required: true
        default: "0.98"
        type: string

concurrency:
  group: aboutyou-price-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REFRESH_MAX_STEPS: ${{ inputs.max_steps || '300' }}
      REFRESH_DELAY: ${{ inputs.scroll_delay_ms || '400' }}
      REFRESH_MIN_COVERAGE: ${{ inputs.minimum_partition_coverage || '0.98' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate database secret
        run: test -n "$DATABASE_URL" || (echo "DATABASE_URL GitHub secret is missing" && exit 1)
      - run: npx playwright install --with-deps chromium
      - name: Refresh ABOUT YOU prices
        run: >-
          npm run refresh:aboutyou:prices --
          --max-steps="$REFRESH_MAX_STEPS"
          --delay="$REFRESH_DELAY"
          --min-partition-coverage="$REFRESH_MIN_COVERAGE"
