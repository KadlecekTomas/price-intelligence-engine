name: Full Catalog Sync

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
    inputs:
      start_url:
        description: "Public ABOUT YOU CZ men's root category URL"
        required: true
        default: "https://www.aboutyou.cz/c/muzi-20202"
        type: string
      split_above:
        description: "Split category when reported count is above this value"
        required: true
        default: "850"
        type: string
      max_steps:
        description: "Maximum lazy-load steps per leaf partition"
        required: true
        default: "350"
        type: string
      scroll_delay_ms:
        description: "Delay between lazy-load steps (ms)"
        required: true
        default: "450"
        type: string
      minimum_coverage:
        description: "Required global catalog coverage before publication"
        required: true
        default: "0.995"
        type: string
      concurrency:
        description: "Parallel partition workers (bounded to 1-6)"
        required: true
        default: "3"
        type: string

concurrency:
  group: aboutyou-full-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SYNC_URL: ${{ inputs.start_url || 'https://www.aboutyou.cz/c/muzi-20202' }}
      SPLIT_ABOVE: ${{ inputs.split_above || '850' }}
      SYNC_MAX_STEPS: ${{ inputs.max_steps || '350' }}
      SYNC_DELAY: ${{ inputs.scroll_delay_ms || '450' }}
      MIN_COVERAGE: ${{ inputs.minimum_coverage || '0.995' }}
      SYNC_CONCURRENCY: ${{ inputs.concurrency || '3' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Validate sync secret
        run: test -n "$DATABASE_URL" || (echo "DATABASE_URL GitHub secret is missing" && exit 1)
      - name: Sync verified ABOUT YOU catalog partitions
        run: >-
          npm run sync:aboutyou:partitioned --
          --url="$SYNC_URL"
          --split-above="$SPLIT_ABOVE"
          --max-steps="$SYNC_MAX_STEPS"
          --delay="$SYNC_DELAY"
          --min-coverage="$MIN_COVERAGE"
          --concurrency="$SYNC_CONCURRENCY"
