name: Market Provider Smoke

on:
  pull_request:
  workflow_dispatch:

jobs:
  zalando-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Verify Zalando CZ public search and PDP pricing
        run: npm run probe:zalando-market
