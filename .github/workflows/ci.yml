name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Temporary ABOUT YOU source transport discovery
        run: node scripts/discover-aboutyou.mjs
      - name: Install Chromium for temporary ABOUT YOU network probe
        run: npx playwright install --with-deps chromium
      - name: Temporary ABOUT YOU anonymous network probe
        run: node scripts/probe-aboutyou-network.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
