name: Full Catalog Smoke

on:
  pull_request:
    branches: [main]

jobs:
  aboutyou-1k:
    if: github.head_ref == 'feat/full-catalog-production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Collect at least 1,000 public products
        run: |
          set +e
          set -o pipefail
          npm run sync:aboutyou -- --dry-run --target=1000 --max-steps=120 --delay=350 | tee /tmp/full-sync.log
          sync_status=${PIPESTATUS[0]}
          if [ "$sync_status" -eq 0 ] && grep -Eq 'Produkty: (1[ .]?000|[1-9][0-9 .]{3,})' /tmp/full-sync.log; then
            exit 0
          fi
          echo "1k threshold not reached; collecting public pagination diagnostics..."
          node scripts/probe-aboutyou-pagination.mjs
          echo "Inspecting public stream item protobuf schema..."
          node scripts/discover-aboutyou-item-proto.mjs
          exit 1
